<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="29.WeatherApp.css">

<body>
    <div class="container">
    <h1>Weather App</h1>
        <form action="">

        <div class="weather-data">
